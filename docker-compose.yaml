services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bot_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-memory}
      TZ: Asia/Yekaterinburg
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    secrets:
      - db_password
    healthcheck:
      test: ['CMD-SHELL', 'date +%Z | grep +05 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    image: pablosergeev/telegram-bot-jarvis:latest
    container_name: telegram-bot
    restart: unless-stopped
    environment:
      TZ: Asia/Yekaterinburg
    env_file:
      - .env
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD', 'sh', '-c', 'date +%Z | grep +05']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local

secrets:
  db_password:
    file: ./db_password.txt
